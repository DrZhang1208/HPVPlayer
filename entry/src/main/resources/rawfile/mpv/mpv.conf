# HPVPlayer 默认 mpv 配置
# 此文件由应用在首次启动时释放到 mpv 配置目录，可自由修改，下次播放生效。
# 完整选项说明见 mpv 手册: https://mpv.io/manual/master/
# 注意: vo、gpu-context、hwdec 等平台必需项由应用管理，在此修改不会生效。

# ===== 音频 =====
volume=100

# ===== 缓冲 =====
demuxer-max-bytes=1024MiB
demuxer-max-back-bytes=512MiB

# ===== 视频 =====
video-sync=display-resample
# target-colorspace-hint=yes 与 vo=gpu-next 组合在某些版本会触发渲染线程崩溃
# (mpv#16175)，默认关闭；需要 HDR 色彩切换可自行打开
# target-colorspace-hint=yes
# ohos 平台建议保持关闭以下画质选项（性能考虑）
correct-downscaling=no
sigmoid-upscaling=no
dither-depth=no

# ===== 字幕 =====
# 自动加载同名外挂字幕（fuzzy 模糊匹配）
sub-auto=fuzzy
sub-file-paths=sub:subtitles
subs-fallback=yes
sub-scale-with-window=no
sub-use-margins=no
# 字幕样式
sub-font-size=38
sub-color=#ffffffff
sub-outline-size=2
sub-outline-color=#ff000000
sub-bold=yes
sub-italic=no
sub-blur=2
